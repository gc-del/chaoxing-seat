name: test-dispatch

# 一次性验证：GITHUB_TOKEN（带 actions: write）能否通过 workflow_dispatch API
# 触发 seat.yml。验证完即删除本文件。

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  t:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 用 GITHUB_TOKEN dispatch seat.yml
        run: |
          gh workflow run seat.yml -f mode=dryrun -R gc-del/chaoxing-seat
          echo "dispatch 命令返回码: $?"
          sleep 8
          gh run list -R gc-del/chaoxing-seat --limit 5
