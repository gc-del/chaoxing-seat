name: seat-grab

on:
  schedule:
    # UTC 22:50 = 北京时间 06:50（刻意避开整点，GitHub 整点排队严重、延迟大）
    - cron: "50 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式（定时触发时忽略此项）"
        required: true
        default: "dryrun"
        type: choice
        options:
          - dryrun
          - diagnose
          - grab

permissions:
  contents: read

concurrency:
  group: seat-grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --disable-pip-version-check --quiet requests Pillow cryptography

      - name: 生成配置
        env:
          CX_USER: ${{ secrets.CX_USER }}
          CX_PASS: ${{ secrets.CX_PASS }}
          CX_ROOM_ID: ${{ secrets.CX_ROOM_ID }}
          CX_SEAT_NUM: ${{ secrets.CX_SEAT_NUM }}
          CX_START: ${{ secrets.CX_START }}
          CX_END: ${{ secrets.CX_END }}
          CX_GRAB_TIME: ${{ secrets.CX_GRAB_TIME }}
          CX_RESERVE_NEXT_DAY: ${{ secrets.CX_RESERVE_NEXT_DAY }}
          CX_DAYS: ${{ secrets.CX_DAYS }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          GLM_KEY: ${{ secrets.GLM_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: python render_config.py

      - name: 执行（dryrun 只组装请求包不提交）
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            dryrun)  python -u main.py dryrun ;;
            diagnose) python -u diagnose.py ;;
            grab)    python -u main.py grab ;;
            *)       echo "未知模式 $MODE"; exit 2 ;;
          esac

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grab-logs
          path: debug_median/
          if-no-files-found: ignore
