name: seat-grab

on:
  schedule:
    # 正式触发点（UTC 22:40~22:55 = 北京 06:40~06:55，刻意避开整点拥塞）
    # 注：本账号的 schedule 事件实测不可用（社区已知问题），保留仅作备份，
    #     真正生效的是下方 heartbeat 推送链
    - cron: "40 22 * * *"
    - cron: "45 22 * * *"
    - cron: "50 22 * * *"
    - cron: "55 22 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式（定时触发时忽略此项）"
        required: true
        default: "dryrun"
        type: choice
        options:
          - dryrun
          - diagnose
          - grab

permissions:
  contents: write

jobs:
  # 心跳链：GitHub 的 schedule 事件在本账号上不可用（免费账户+新账号，
  # 私有仓库 cron 不触发，改公开后仍被账号级限制卡住，实测 0 次触发）。
  # 故改用 push 自循环：定期推一个 amend 空提交唤醒下一次运行。
  # 公开仓库 Actions 额度无限，runner 占用无成本。
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: heartbeat
      cancel-in-progress: true   # 始终只保留一个心跳 job
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 心跳循环（每 10 分钟推一次 amend 空提交，唤醒下一次运行）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 60); do
            sleep 600
            git commit --amend --no-edit --allow-empty -m "heartbeat $(date -u +%H%M%S)"
            git push --force || echo "push 失败，继续等待下一次心跳"
          done

  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    concurrency:
      group: grab
      cancel-in-progress: false
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 窗口判断（窗口外立即退出，不浪费 runner 与额度）
        run: |
          H=$(TZ=Asia/Shanghai date +%H); M=$(TZ=Asia/Shanghai date +%M)
          HM=$((10#$H * 60 + 10#$M))
          echo "北京时间 $(TZ=Asia/Shanghai date '+%F %T')"
          if [ "$HM" -lt 390 ] || [ "$HM" -gt 690 ]; then
            echo "不在抢座窗口（06:30-11:30），跳过本轮"
            exit 78
          fi

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置时区（代码层已固定北京时间，这里只是兜底）
        run: sudo timedatectl set-timezone Asia/Shanghai || true

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --disable-pip-version-check --quiet requests Pillow cryptography

      - name: 生成配置
        env:
          CX_USER: ${{ secrets.CX_USER }}
          CX_PASS: ${{ secrets.CX_PASS }}
          CX_ROOM_ID: ${{ secrets.CX_ROOM_ID }}
          CX_SEAT_NUM: ${{ secrets.CX_SEAT_NUM }}
          CX_START: ${{ secrets.CX_START }}
          CX_END: ${{ secrets.CX_END }}
          CX_GRAB_TIME: ${{ secrets.CX_GRAB_TIME }}
          CX_RESERVE_NEXT_DAY: ${{ secrets.CX_RESERVE_NEXT_DAY }}
          CX_DAYS: ${{ secrets.CX_DAYS }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          GLM_KEY: ${{ secrets.GLM_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: python render_config.py

      - name: 执行（dryrun 只组装请求包不提交）
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            dryrun)  python -u main.py dryrun ;;
            diagnose) python -u diagnose.py ;;
            grab)    python -u main.py grab ;;
            *)       echo "未知模式 $MODE"; exit 2 ;;
          esac

      - name: 结果摘要（手机上 GitHub App 也能直接看）
        if: always()
        run: |
          echo "## 抢座任务结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 debug_median/log_*.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "(无日志产出)" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grab-logs
          path: debug_median/
          if-no-files-found: ignore
