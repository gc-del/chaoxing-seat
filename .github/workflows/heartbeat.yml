name: seat-heartbeat

# 心跳链：GitHub 的 schedule 事件在本账号上不可用（免费账户+新账号，
# 私有仓库 cron 不触发，改公开后仍被账号级限制卡住，实测 0 次触发）。
# 故改用 push 自循环：定期推一个 amend 空提交，唤醒 seat-grab workflow。
# 公开仓库 Actions 额度无限，runner 占用无成本。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartbeat
  cancel-in-progress: true   # 始终只保留一个心跳 job

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 心跳循环（每 10 分钟推一次 amend 空提交，唤醒 seat-grab）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 60); do
            sleep 600
            git fetch origin main || true
            if ! git rebase FETCH_HEAD 2>/dev/null; then
              git rebase --abort || true
              echo "rebase 冲突，跳过本次心跳（避免覆盖其它 run 提交的标记）"
              continue
            fi
            git commit --amend --no-edit --allow-empty -m "heartbeat $(date -u +%H%M%S)"
            git push --force || echo "push 失败，继续等待下一次心跳"
          done
