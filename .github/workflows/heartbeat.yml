name: seat-heartbeat

# 心跳链 v2：用 GITHUB_TOKEN 调 workflow_dispatch API 唤醒 seat-grab。
#
# 依据（GitHub 官方）：
# 1. GITHUB_TOKEN 触发的事件默认不创建 run（防递归）——旧的 git push 心跳因此失效，
#    仓库历史中的 heartbeat commit 已证实从未触发过任何 run。
# 2. workflow_dispatch / repository_dispatch 是官方明确例外：
#    "workflow_dispatch and repository_dispatch events always create workflow runs"
#    （changelog 2022-09-08：GITHUB_TOKEN 可用于这两种事件触发 workflow）
# 3. schedule 实测延迟 3.4~3.7 小时且丢弃部分调度（06:40 排定 → 10:22 才跑），
#    不可作为准点保障；workflow_dispatch API 触发是实时的。

on:
  workflow_dispatch:

permissions:
  actions: write          # workflow_dispatch API 必需（最小权限）

concurrency:
  group: heartbeat
  cancel-in-progress: true   # 手动拉起新心跳时旧心跳让位

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # GitHub-hosted runner 单 job 上限 6 小时
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 心跳循环（dispatch 唤醒 seat-grab，只在抢座窗口附近发车）
        run: |
          set -u
          for i in $(seq 1 33); do             # 33 × 10 分钟 ≈ 5.5 小时一轮
            BJ_HM=$((10#$(TZ=Asia/Shanghai date +%H%M)))
            if [ "$BJ_HM" -ge 620 ] && [ "$BJ_HM" -le 720 ]; then
              # 北京 06:20–07:20 才 dispatch（窗口外拉起的 grab run 只会白跑）
              if gh workflow run seat.yml -f mode=grab -R gc-del/chaoxing-seat; then
                echo "已 dispatch seat-grab（北京 $(TZ=Asia/Shanghai date '+%F %T')）"
              else
                echo "dispatch 失败（API 暂时不可用，下一轮重试）"
              fi
            else
              echo "北京 $(TZ=Asia/Shanghai date '+%F %T') 不在发车窗口（06:20-07:20），等待下一轮"
            fi
            sleep 600
          done
          # 接力：拉起新心跳，避免本轮超时后链断
          for t in 1 2 3 4 5; do
            if gh workflow run seat-heartbeat -R gc-del/chaoxing-seat; then
              echo "已 dispatch 心跳接力"
              break
            fi
            echo "心跳接力 dispatch 失败（第 $t 次），120 秒后重试"
            sleep 120
          done
