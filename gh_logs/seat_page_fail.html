<body>
<div class="code_begin" v-cloak>
  <div class="code_beign_bg">
    <div class="stat_res_btm">
      <p class="stat_tips">
        <span class="tip_icon" :class="getBluetoothIconClass"></span>
        <span class="tip_text" v-show="getBluetoothTextType == 0">正在搜索蓝牙基站</span>
        <span class="tip_text" v-show="getBluetoothTextType == 1">点击下方按钮完成签到</span>
        <span class="tip_text" v-show="getBluetoothTextType == 2">未搜索到指定蓝牙基站<br>请移动至基站覆盖范围内重试</span>
        <span class="tip_text" v-show="getBluetoothTextType == 3">初始化蓝牙模块失败，请刷新页面重试</span>
        <span class="tip_icon" :class="getlocationIconClass"></span>
        <span class="tip_text" v-show="getlocationTextType == 1">定位中...</span>
        <span class="tip_text" v-show="getlocationTextType == 2">点击下方按钮完成签到</span>
        <span class="tip_text" v-show="getlocationTextType == 3">未在指定签到范围</span>
      </p>
    </div>
    <div class="start_gray_btn" :class="getSignMenuClass" @click="signIn"></div>
  </div>
  
  <div class="seat_loading" v-show="isLoading">
    <span class="load_icon"></span>
    <p class="load_tip">定位中...</p>
  </div>
</div>
<script>
  require(['jquery', 'Vue', 'moment', 'popup', 'baseUtils', 'thirdAppUtils', 'jweixin', 'wxinit', 'jrxyUtils'], function ($, Vue, moment, popup, BaseUtils, thirdAppUtils, wx, wxinit, JrxyUtils) {
    'use strict'
    var roomId = '6657', seatNum = '192'
    function operateData(url, data) {
      return $.getJSON(url, data)
    }
    function signInSubmit(_this) {
      if (!_this.submitStatus) {
        return
      }
      if (_this.isLoading) {
        return
      }
      if (_this.isCheckAddress && !_this.isAddressTrue) {
        popup.alert('未在签到范围内！')
        return
      }
      if (_this.seatConfig.isPosition === 5 && _this.jrxyCustom) {
        if (_this.bluetoothStatus === 0) {
          return
        }
        if (_this.bluetoothStatus === 2) {
          return
        }
      }
      _this.submitStatus = false
      if (_this.bjjtApp && _this.seatConfig.isPosition === 8) {
        var res = BaseUtils.inRoom(_this.seatConfig.deptId, data.uid)
        if (!res.responseJSON.success) {
          _this.submitStatus = true
          popup.alert(res.responseJSON.msg)
          return
        }
      }
      operateData('data/apps/seat/sign', {id: _this.seatReserve.id}).then(function (json) {
        if (json.success) {
          location.reload()
        } else {
          popup.alert(json.msg)
        }
        setTimeout(function () {
          _this.submitStatus = true
        }, 1000)
      })
    }
    function loadMap(_this) {
      var locationType = wxinit.getLocationType()
      if (!BaseUtils.isWechatApp()) {
        locationType = BaseUtils.getThirdLocationDept(_this.seatConfig.deptId, locationType)
      }
      switch (locationType) {
        case 0:
          BaseUtils.bMapLocation($.Deferred()).done(function (res) {
            verifyLocation(_this, res.split(',')[0], res.split(',')[1])
          })
          break
        case 124841:
          thirdAppUtils.orientation.locationService().then(function (res) {
            var data = JSON.parse(res)
            var map = BaseUtils.bd_decrypt(data.longitude, data.latitude)
            verifyLocation(_this, map.lng, map.lat)
          })
          break
        case 6227:
          setTimeout(function () {
            if (_this.initJrxyApiSuccess) {
              JrxyUtils.location($.Deferred()).done(function (res) {
                if (res.success) {
                  verifyLocation(_this, res.lng, res.lat)
                } else {
                  popup.alert('今日校园调取定位协议失败')
                }
              })
            } else {
              popup.alert('今日校园环境初始化失败，请刷新页面重试')
            }
          }, 1000)
          break
        case 1:
        default:
          BaseUtils.wechatLocation(wx, $.Deferred()).done(function (res) {
            verifyLocation(_this, res.split(',')[0], res.split(',')[1])
          })
          break
      }
    }
    function verifyLocation(_this, lng, lat) {
      var locationLogs = []
      $.each(_this.addressArr, function (i, v) {
        var distance = BaseUtils.getDistance(lng, lat, v.location.split(',')[0], v.location.split(',')[1])
        if (distance <= Number(v.offsetReal)) {
          _this.isAddressTrue = true
        }
        locationLogs.push({
          appType: 0,
          deptId: _this.seatConfig.deptId,
          appId: _this.seatConfig.id,
          source: 1,
          location: v.location,
          locationTemp: lng + ',' + lat,
          distance: distance,
          offset: v.offsetReal
        })
      })
      if (!_this.isAddressTrue) {
        BaseUtils.addLocationLog(locationLogs)
      }
      _this.isLoading = false
    }
    new Vue({
      el: '.code_begin',
      data: function () {
        return {
          seatConfig: {},
          seatReserve: {},
          submitStatus: true,
          addressArr: [],
          isCheckAddress: false, // 签到是否需要校验位置信息（规则设置需要 + 有添加位置信息）
          isAddressTrue: false, //是否可签到
          isLoading: false,
          bluetoothStatus: 0, //0/1/2 搜索中 匹配成功 匹配失败
          initJrxyApiSuccess: true, //今日校园apps jsApi初始化状态
          bjjtApp: false
        }
      },
      methods: {
        signIn: function () {
          var _this = this
          signInSubmit(_this)
        }
      },
      computed: {
        getSignMenuClass: function () {
          var _this = this
          if ((BaseUtils.isJrxyApp() && _this.seatConfig.isPosition === 5 && _this.jrxyCustom && _this.bluetoothStatus === 1) ||
              ((_this.seatConfig.isPosition === 1 || _this.seatConfig.isPosition === 2 || _this.seatConfig.isPosition === 7) && (!_this.isLoading && _this.isAddressTrue)) ||
              (_this.seatConfig.isPosition === 3 || _this.seatConfig.isPosition === 4 || _this.seatConfig.isPosition === 0)) {
            return 'code_begin_btn'
          }
        },
        getlocationIconClass: function () {
          var _this = this
          if (_this.seatConfig.isPosition === 1 || _this.seatConfig.isPosition === 2 || _this.seatConfig.isPosition === 7) {
            if (_this.isLoading && !_this.isAddressTrue) {
              return 'loading_icon'
            }
            if (!_this.isLoading && !_this.isAddressTrue) {
              return 'error_icon'
            }
            if (!_this.isLoading && _this.isAddressTrue) {
              return 'success_icon'
            }
          }
        },
        getlocationTextType: function () {
          var _this = this
          if (_this.seatConfig.isPosition === 1 || _this.seatConfig.isPosition === 2 || _this.seatConfig.isPosition === 7) {
            if (_this.isLoading && !_this.isAddressTrue) {
              return 1
            }
            if (!_this.isLoading && !_this.isAddressTrue) {
              return 3
            }
            if (!_this.isLoading && _this.isAddressTrue) {
              return 2
            }
          }
        },
        getBluetoothIconClass: function () {
          var _this = this
          if (BaseUtils.isJrxyApp() && _this.seatConfig.isPosition === 5 && _this.jrxyCustom) {
            if (_this.bluetoothStatus === 0 && _this.initJrxyApiSuccess) {
              return 'loading_icon'
            }
            if (_this.bluetoothStatus === 2 || !_this.initJrxyApiSuccess) {
              return 'error_icon'
            }
            if (_this.bluetoothStatus === 1 && _this.initJrxyApiSuccess) {
              return 'success_icon'
            }
          }
        },
        getBluetoothTextType: function () {
          var _this = this
          if (BaseUtils.isJrxyApp() && _this.seatConfig.isPosition === 5 && _this.jrxyCustom) {
            if (_this.bluetoothStatus === 0 && _this.initJrxyApiSuccess) {
              return 0
            }
            if (_this.bluetoothStatus === 1 && _this.initJrxyApiSuccess) {
              return 1
            }
            if (_this.bluetoothStatus === 2 && _this.initJrxyApiSuccess) {
              return 2
            }
            if (!_this.initJrxyApiSuccess) {
              return 3
            }
          }
        },
        jrxyCustom: function () {
          var fids = [21027, 6227]
          return fids.includes(this.seatConfig.deptId)
        },
        bjsyhgMirrorCustom: function () {
          var fids = [40125, 97253]
          return fids.includes(this.seatConfig.deptId)
        }
      },
      mounted: function () {
        var _this = this
        //获教室信息及配置信息
        operateData('data/apps/seat/reserve/info', {id: roomId, seatNum: seatNum}).then(function (json) {
          if (json.success && json.data.seatReserve) {
            _this.seatReserve = json.data.seatReserve
            _this.seatConfig = json.data.seatConfig
            if (_this.bjsyhgMirrorCustom) {
              window.document.title = '隔音亭预约'
            }
            _this.bjjtApp = _this.seatConfig.deptId === 24676 //北京交通大学定制
            if (_this.seatConfig.isPosition === 1 || _this.seatConfig.isPosition === 2 || _this.seatConfig.isPosition === 7) {
              operateData('data/apps/seat/address', {deptId: _this.seatConfig.deptId, roomId: roomId}).then(function (res) {
                if (res.success) {
                  if (res.data.addressArr.length > 0) {
                    _this.addressArr = res.data.addressArr
                    _this.isCheckAddress = true
                    _this.isLoading = true
                    loadMap(_this)
                  } else {
                    _this.isAddressTrue = true
                  }
                }
              })
            }
            if (BaseUtils.isJrxyApp() && _this.jrxyCustom) {
              var ele = document.createElement('script');
              ele.setAttribute('type', 'text/javascript');
              ele.setAttribute('src', 'https://static.campushoy.com/sdks/js/open/release/campushoy-2.0.5.js');
              document.body.appendChild(ele);
              JrxyUtils.initJrxy(_this, _this.seatConfig.deptId)
              if (_this.seatConfig.isPosition === 5) {
                operateData('data/apps/seat/bluetooths', {roomId: roomId}).then(function (res) {
                  if (res.success) {
                    var data = []
                    for (var i = 0; i < res.data.rows.length; i++) {
                      data.push({name: res.data.rows[i].name})
                    }
                    _this.bluetoothStatus = 0
                    setTimeout(function () {
                      if (_this.initJrxyApiSuccess) {
                        JrxyUtils.clientBluetoothSignIn(data).then(function (bluetoothRes) {
                          if (bluetoothRes.result) {
                            _this.bluetoothStatus = 1
                            return
                          }
                          _this.bluetoothStatus = 2
                        })
                      } else {
                        popup.alert('初始化蓝牙模块失败，请刷新页面重试')
                      }
                    }, 1000)
                  }
                })
              }
            }
          }
        })
      },
      created: function () {
        wxinit.initWechatScanner(wx)
      }
    })
  })
</script>

  require(['lever', 'ratio'], function (AlloyLever) {
